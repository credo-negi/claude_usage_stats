<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* Material Design 3 ベース。シードカラー #F5B0A3 から Material の TonalSpot（2021 仕様）で生成したカラーロール。
   トーンの割り当ては M3 標準（ライト: primary=P40 / surface=N98 ほか、ダーク: primary=P80 / surface=N6 ほか）。 */
:root {
  color-scheme: light;
  --primary: #904b3e; --on-primary: #ffffff;
  --primary-container: #ffdad4; --on-primary-container: #3a0a04;
  --secondary-container: #ffdad4; --on-secondary-container: #2c1511;
  --tertiary-container: #fae0a6; --on-tertiary-container: #251a00;
  --surface: #fff8f6; --surface-low: #fff0ee; --surface-mid: #fceae6; --surface-high: #f7e4e1;
  --on-surface: #231918; --on-surface-variant: #534340;
  --outline: #857370; --outline-variant: #d8c2be; --muted: #6c5b57;
  --state-hover: rgba(144,75,62,.08); --state-press: rgba(144,75,62,.12);
  /* チャートのカテゴリ色: primary と同じ HCT（トーン50・彩度36〜40）で色相だけ振ったもの */
  --s1: #ad6355; --s2: #4e79b1; --s3: #458453; --s4: #967117;
  --s5: #9167a6; --s6: #008583; --s7: #b4607f; --s8: #707d2e; --s-other: #a29390;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --primary: #ffb4a6; --on-primary: #561e15;
    --primary-container: #733429; --on-primary-container: #ffdad4;
    --secondary-container: #5d3f3a; --on-secondary-container: #ffdad4;
    --tertiary-container: #554519; --on-tertiary-container: #fae0a6;
    --surface: #1a1110; --surface-low: #231918; --surface-mid: #271d1c; --surface-high: #322826;
    --on-surface: #f1dfdb; --on-surface-variant: #d8c2be;
    --outline: #a08c89; --outline-variant: #534340; --muted: #bca7a3;
    --state-hover: rgba(255,180,166,.08); --state-press: rgba(255,180,166,.12);
    --s1: #f79f8f; --s2: #8eb8f4; --s3: #83c58d; --s4: #dbb052;
    --s5: #d4a5e9; --s6: #61c6c3; --s7: #f2a0bd; --s8: #afbe66; --s-other: #7d6f6c;
    --shadow: 0 1px 3px rgba(0,0,0,.6), 0 4px 8px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #ffb4a6; --on-primary: #561e15;
  --primary-container: #733429; --on-primary-container: #ffdad4;
  --secondary-container: #5d3f3a; --on-secondary-container: #ffdad4;
  --tertiary-container: #554519; --on-tertiary-container: #fae0a6;
  --surface: #1a1110; --surface-low: #231918; --surface-mid: #271d1c; --surface-high: #322826;
  --on-surface: #f1dfdb; --on-surface-variant: #d8c2be;
  --outline: #a08c89; --outline-variant: #534340; --muted: #bca7a3;
  --state-hover: rgba(255,180,166,.08); --state-press: rgba(255,180,166,.12);
  --s1: #f79f8f; --s2: #8eb8f4; --s3: #83c58d; --s4: #dbb052;
  --s5: #d4a5e9; --s6: #61c6c3; --s7: #f2a0bd; --s8: #afbe66; --s-other: #7d6f6c;
  --shadow: 0 1px 3px rgba(0,0,0,.6), 0 4px 8px 3px rgba(0,0,0,.4);
}
:root {   /* チャート・表が参照する別名 */
  --ink: var(--on-surface); --ink-2: var(--on-surface-variant);
  --grid: var(--outline-variant); --axis: var(--outline); --hover: var(--state-hover);
  --card: var(--surface-low); --accent: var(--primary);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--surface); color: var(--on-surface);
  font: 400 14px/20px Roboto, system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  letter-spacing: .25px;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px 16px 64px; }
header {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 8px 0 12px;
}
h1 { font-size: 24px; line-height: 32px; font-weight: 400; letter-spacing: 0; margin: 0; }
.sub { color: var(--on-surface-variant); font-size: 13px; line-height: 20px; }
h2 { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: .15px; margin: 0 0 2px; }
.hint { color: var(--on-surface-variant); font-size: 12px; line-height: 16px; letter-spacing: .4px; margin: 0 0 12px; }
button, select, input { font: inherit; color: var(--on-surface); letter-spacing: inherit; }

/* ボタン: 通常は outlined、テーマ切替は tonal */
.btn {
  background: transparent; border: 1px solid var(--outline); border-radius: 20px;
  padding: 0 16px; cursor: pointer; min-height: 40px; color: var(--primary); font-weight: 500; letter-spacing: .1px;
}
.btn:hover { background: var(--state-hover); }
.btn:active { background: var(--state-press); }
.btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }
.btn.tonal:hover { background: var(--secondary-container); box-shadow: var(--shadow); }
/* フィルターチップ（選択時は secondary container + チェック） */
.chip {
  background: transparent; border: 1px solid var(--outline); border-radius: 8px;
  padding: 0 12px; min-height: 32px; cursor: pointer; font-weight: 500; font-size: 14px; letter-spacing: .1px;
  color: var(--on-surface-variant);
}
.chip:hover { background: var(--state-hover); }
.chip[aria-pressed="true"] { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }
.chip[aria-pressed="true"]::before { content: "\2713\00a0"; }
/* セグメントボタン */
.segmented { display: inline-flex; }
.segmented > button {
  background: transparent; border: 1px solid var(--outline); padding: 0 16px; min-height: 40px; cursor: pointer;
  color: var(--on-surface); font-weight: 500; letter-spacing: .1px; margin-left: -1px;
}
.segmented > button:first-child { border-radius: 20px 0 0 20px; margin-left: 0; }
.segmented > button:last-child { border-radius: 0 20px 20px 0; }
.segmented > button:hover { background: var(--state-hover); }
.segmented > button[aria-pressed="true"] { background: var(--secondary-container); color: var(--on-secondary-container); }
.segmented > button[aria-pressed="true"]::before { content: "\2713\00a0"; }
.btn:focus-visible, .chip:focus-visible, .segmented > button:focus-visible, select:focus-visible, input:focus-visible,
summary:focus-visible, .hit:focus-visible, th.sortable:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px;
}

.filters { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin: 8px 0 20px; }
.group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.group > label { color: var(--on-surface-variant); font-size: 12px; letter-spacing: .4px; }
/* outlined テキストフィールド風のセレクト・日付入力 */
select, input[type="date"] {
  background: transparent; border: 1px solid var(--outline); border-radius: 4px;
  padding: 0 12px; min-height: 40px; max-width: 260px;
}
select:hover, input[type="date"]:hover { border-color: var(--on-surface); }
select:focus, input[type="date"]:focus { border-color: var(--primary); }
select option { background: var(--surface-high); color: var(--on-surface); }
.warn {
  background: var(--tertiary-container); color: var(--on-tertiary-container); border-radius: 12px;
  padding: 12px 16px; margin: 0 0 12px; font-size: 14px;
}
.hero { display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-end; margin: 8px 0 20px; }
.hero .big { font-size: 52px; font-weight: 400; line-height: 60px; letter-spacing: 0; color: var(--primary); }
.hero .lbl { color: var(--on-surface-variant); font-size: 14px; font-weight: 500; letter-spacing: .1px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface-mid); border-radius: 12px; padding: 12px 16px; }
.tile .k { color: var(--on-surface-variant); font-size: 12px; line-height: 16px; letter-spacing: .5px; font-weight: 500; }
.tile .v { font-size: 24px; font-weight: 400; line-height: 32px; letter-spacing: 0; }
.tile .d { color: var(--muted); font-size: 12px; line-height: 16px; letter-spacing: .4px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--outline-variant); border-radius: 16px; padding: 20px 16px 16px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } .hero .big { font-size: 44px; line-height: 52px; } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 4px 0 6px; font-size: 12px; color: var(--on-surface-variant); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font: 11px Roboto, system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; fill: var(--muted); }
svg text.val { fill: var(--on-surface); font-weight: 500; }
svg text.lab { fill: var(--on-surface-variant); font-size: 12px; }
.seg { transition: opacity .1s; }
.seg:hover, .hit:hover ~ .seg { opacity: .85; }
.hit { fill: transparent; cursor: default; }
.hit:hover, .hit:focus { fill: var(--state-hover); }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--primary); font-size: 14px; font-weight: 500; letter-spacing: .1px; width: fit-content; border-radius: 4px; padding: 2px 4px; }
.twrap { max-height: 320px; overflow: auto; margin-top: 8px; border: 1px solid var(--outline-variant); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--outline-variant); }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
thead th { position: sticky; top: 0; background: var(--surface-mid); color: var(--on-surface-variant); font-weight: 500; letter-spacing: .1px; }
td.num, th.num { font-variant-numeric: tabular-nums; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--on-surface); background: var(--surface-high); }
td.prompt { max-width: 360px; overflow: hidden; text-overflow: ellipsis; text-align: left; color: var(--on-surface-variant); }
tbody tr:hover td { background: var(--state-hover); }
tr:last-child td { border-bottom: 0; }
.more { margin-top: 12px; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
#tip {
  position: fixed; z-index: 10; pointer-events: none; display: none; max-width: 320px;
  background: var(--surface-high); color: var(--on-surface); border-radius: 12px;
  box-shadow: var(--shadow); padding: 8px 12px; font-size: 12px; line-height: 16px;
}
#tip .th { color: var(--on-surface-variant); margin-bottom: 4px; font-weight: 500; }
#tip .tr { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
#tip .tr b { color: var(--on-surface); font-weight: 500; margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
#tip .tr span { color: var(--on-surface-variant); }
#tip .key { width: 10px; height: 3px; border-radius: 2px; flex: none; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
footer { margin-top: 24px; color: var(--muted); font-size: 12px; line-height: 16px; letter-spacing: .4px; }
footer p { margin: 4px 0; }
.busy { opacity: .6; }
@media print { .filters, .btn, details { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>__TITLE__</h1>
      <div class="sub" id="meta"></div>
    </div>
    <button class="btn tonal" id="theme" type="button" aria-label="配色の切り替え">配色: 自動</button>
  </header>

  <div id="warnings"></div>

  <div class="filters" role="group" aria-label="絞り込み">
    <div class="group" id="ranges" role="group" aria-label="期間"></div>
    <div class="group">
      <label for="from">期間指定</label>
      <input type="date" id="from"> <span class="sub">〜</span> <input type="date" id="to">
    </div>
    <div class="group"><label for="proj">プロジェクト</label><select id="proj"></select></div>
    <div class="group"><label for="model">モデル</label><select id="model"></select></div>
    <div class="segmented" role="group" aria-label="指標">
      <button type="button" data-metric="cost" aria-pressed="true">金額(USD)</button>
      <button type="button" data-metric="tokens" aria-pressed="false">トークン</button>
    </div>
  </div>

  <div id="root">
    <div class="hero">
      <div><div class="lbl">概算利用金額（割引適用後）</div><div class="big" id="hero"></div><div class="sub" id="hero-sub"></div></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <section class="card wide" id="c-day"></section>
      <section class="card" id="c-month"></section>
      <section class="card" id="c-model"></section>
      <section class="card wide" id="c-proj"></section>
      <section class="card wide" id="c-kind"></section>
      <section class="card wide" id="c-turn"></section>
    </div>
  </div>

  <footer id="foot"></footer>
</div>
<div id="tip" role="tooltip"></div>

<script id="data" type="application/json">__DATA_JSON__</script>
<script>
(function () {
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var SVGNS = 'http://www.w3.org/2000/svg';
var MAX_SLOTS = 8;

/* ---------- 小さなユーティリティ ---------- */
function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) { if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  (kids || []).forEach(function (c) { e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function sv(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) { if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(e);
  return e;
}
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
var nfInt = new Intl.NumberFormat('ja-JP');
function money(v, compact) {
  if (compact && v >= 10000) return '$' + (v / 1000).toFixed(0) + 'K';
  if (compact && v >= 1000) return '$' + (v / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  if (v >= 1000) return '$' + Math.round(v).toLocaleString('en-US');
  return '$' + v.toFixed(v >= 100 ? 1 : 2);
}
function tokFmt(v, compact) {
  if (!compact) return nfInt.format(Math.round(v));
  if (v >= 1e9) return (v / 1e9).toFixed(v >= 1e10 ? 0 : 1).replace(/\.0$/, '') + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(v >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(v >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return String(Math.round(v));
}
var state = { range: 'all', from: '', to: '', proj: -1, model: -1, metric: 'cost', turnLimit: 50, sort: 'cost', dir: -1 };
function fmt(v, compact) { return state.metric === 'cost' ? money(v, compact) : tokFmt(v, compact); }
function tickFmt(v) {
  if (state.metric !== 'cost') return tokFmt(v, true);
  if (v >= 1000) return money(v, true);
  return '$' + (Number.isInteger(v) ? v : v.toFixed(v < 1 ? 2 : 1));
}
function metricName() { return state.metric === 'cost' ? '概算金額(USD)' : 'トークン数'; }
function val(f) { return state.metric === 'cost' ? f[10] : f[3] + f[4] + f[5] + f[6] + f[7]; }
function addDays(s, n) { var d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function nextMonth(m) { var y = +m.slice(0, 4), mo = +m.slice(5, 7); mo++; if (mo > 12) { mo = 1; y++; } return y + '-' + (mo < 10 ? '0' : '') + mo; }
function estWidth(str, size) {
  var w = 0;
  for (var i = 0; i < str.length; i++) w += str.charCodeAt(i) > 0x2e80 ? size : size * 0.56;
  return w;
}
function truncate(str, maxPx, size) {
  /* 中間を省略して先頭と末尾を残す（claude-sonnet-5 と claude-sonnet-5-5 のように末尾で区別するため） */
  if (estWidth(str, size) <= maxPx) return str;
  var head = Math.ceil(str.length / 2), tail = str.length - head;
  while (head + tail > 2 && estWidth(str.slice(0, head) + '…' + str.slice(str.length - tail), size) > maxPx) {
    if (head >= tail) head--; else tail--;
  }
  return str.slice(0, head) + '…' + str.slice(str.length - tail);
}

/* ---------- 色: モデルは全期間の金額順で固定スロット（絞り込んでも塗り替えない） ---------- */
function slotVar(i) { return i < MAX_SLOTS ? 'var(--s' + (i + 1) + ')' : 'var(--s-other)'; }

/* ---------- ツールチップ ---------- */
var tip = document.getElementById('tip');
function showTip(header, rows, x, y) {
  clear(tip);
  tip.appendChild(el('div', { 'class': 'th', text: header }));
  rows.forEach(function (r) {
    var row = el('div', { 'class': 'tr' });
    if (r.color) { var k = el('i', { 'class': 'key' }); k.style.background = r.color; row.appendChild(k); }
    row.appendChild(el('span', { text: r.name }));
    row.appendChild(el('b', { text: r.value }));
    tip.appendChild(row);
  });
  tip.style.display = 'block';
  var w = tip.offsetWidth, h = tip.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  var px = x + 14, py = y + 14;
  if (px + w > vw - 8) px = Math.max(8, x - w - 14);
  if (py + h > vh - 8) py = Math.max(8, y - h - 14);
  tip.style.left = px + 'px'; tip.style.top = py + 'px';
}
function hideTip() { tip.style.display = 'none'; }
function bindTip(node, fn) {
  node.addEventListener('pointermove', function (e) { var t = fn(); showTip(t.header, t.rows, e.clientX, e.clientY); });
  node.addEventListener('pointerleave', hideTip);
  node.addEventListener('focus', function () {
    var t = fn(), r = node.getBoundingClientRect(); showTip(t.header, t.rows, r.left + r.width / 2, r.top + 8);
  });
  node.addEventListener('blur', hideTip);
}

/* ---------- 絞り込み ---------- */
function rangeBounds() {
  var lo = '', hi = '';
  var t = D.meta.today;
  if (state.range === '7' || state.range === '30' || state.range === '90') lo = addDays(t, -(+state.range) + 1);
  else if (state.range === 'month') lo = t.slice(0, 7) + '-01';
  else if (state.range === 'custom') { lo = state.from; hi = state.to; }
  return [lo, hi];
}
function selectFacts() {
  var b = rangeBounds(), lo = b[0], hi = b[1];
  return D.facts.filter(function (f) {
    var day = D.days[f[1]];
    if (lo && day < lo) return false;
    if (hi && day > hi) return false;
    if (state.model >= 0 && f[2] !== state.model) return false;
    if (state.proj >= 0 && D.turns[f[0]][1] !== state.proj) return false;
    return true;
  });
}

/* ---------- チャート部品 ---------- */
function niceScale(max, n) {
  if (!(max > 0)) return { top: 1, ticks: [0, 1] };
  var raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  var step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  var top = Math.ceil(max / step - 1e-9) * step, ticks = [];
  for (var v = 0; v <= top + step / 1000; v += step) ticks.push(v);
  return { top: top, ticks: ticks };
}
function topRounded(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, h, w / 2));
  return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
    'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
}
function legend(items) {
  var box = el('div', { 'class': 'legend' });
  items.forEach(function (it) {
    var i = el('i'); i.style.background = it.color;
    box.appendChild(el('span', null, [i, it.name]));
  });
  return box;
}

/* 積み上げ縦棒: cats=[{key,label}], series=[{name,color}], data[seriesIdx][catIdx] */
function stackedColumns(host, cats, series, data, ariaLabel) {
  var W = Math.max(280, host.clientWidth || 600), H = 250;
  var m = { l: 52, r: 8, t: 18, b: 26 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  var totals = cats.map(function (_c, i) { return series.reduce(function (a, _s, j) { return a + data[j][i]; }, 0); });
  var maxT = Math.max.apply(null, totals.concat([0]));
  var sc = niceScale(maxT, 4);
  var svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': ariaLabel });
  function Y(v) { return m.t + ph - (v / sc.top) * ph; }
  sc.ticks.forEach(function (t) {

  var n = cats.length, band = pw / n, barW = Math.max(1, Math.min(24, band * 0.7));

/* ---------- 描画 ---------- */
function seriesFor(rows, keyOf, catIndex, ncats) {
  /* モデルを固定スロットの系列に。9 番目以降は「その他」に畳む */
  var used = {};
  rows.forEach(function (f) { used[f[2]] = true; });
  var ids = D.modelOrder.filter(function (m) { return used[m]; });
  var named = ids.filter(function (m) { return D.modelSlot[m] < MAX_SLOTS; });
  var rest = ids.filter(function (m) { return D.modelSlot[m] >= MAX_SLOTS; });
  var series = named.map(function (m) { return { id: m, name: D.models[m], color: slotVar(D.modelSlot[m]) }; });
  if (rest.length) series.push({ id: -1, name: 'その他 (' + rest.length + ' モデル)', color: 'var(--s-other)', rest: rest });
  var data = series.map(function () { var a = new Array(ncats); for (var i = 0; i < ncats; i++) a[i] = 0; return a; });
  var pos = {};
  series.forEach(function (s, j) { if (s.id >= 0) pos[s.id] = j; else s.rest.forEach(function (m) { pos[m] = j; }); });
  rows.forEach(function (f) { var ci = catIndex(f); if (ci >= 0) data[pos[f[2]]][ci] += val(f); });
  return { series: series, data: data };
}

function init() {
  document.getElementById('meta').textContent =
    (D.meta.first ? D.meta.first + ' 〜 ' + D.meta.last : 'データなし') + ' ／ 集計タイムゾーン: ' + D.meta.tz +
    ' ／ 生成: ' + D.meta.generated;
  var w = document.getElementById('warnings');
  D.meta.warnings.forEach(function (t) { w.appendChild(el('div', { 'class': 'warn', role: 'alert', text: t })); });
  var foot = document.getElementById('foot');
  D.meta.notes.forEach(function (t) { foot.appendChild(el('p', { text: t })); });

  var rg = document.getElementById('ranges');
  [['all', '全期間'], ['month', '今月'], ['7', '直近7日'], ['30', '直近30日'], ['90', '直近90日']].forEach(function (r) {
    var b = el('button', { 'class': 'chip', type: 'button', 'data-range': r[0], text: r[1], 'aria-pressed': r[0] === state.range ? 'true' : 'false' });
    b.onclick = function () { state.range = r[0]; state.from = state.to = ''; document.getElementById('from').value = ''; document.getElementById('to').value = ''; sync(); };
    rg.appendChild(b);
  });
  ['from', 'to'].forEach(function (id) {
    var inp = document.getElementById(id);
    inp.min = D.meta.first ? D.meta.first.slice(0, 10) : ''; inp.max = D.meta.today;
    inp.onchange = function () {
      state.from = document.getElementById('from').value; state.to = document.getElementById('to').value;
      state.range = (state.from || state.to) ? 'custom' : 'all'; sync();
    };
  });
  var ps = document.getElementById('proj');
  ps.appendChild(el('option', { value: '-1', text: 'すべて' }));
  D.projects.forEach(function (p, i) { ps.appendChild(el('option', { value: String(i), text: p.label, title: p.path })); });
  ps.onchange = function () { state.proj = +ps.value; state.turnLimit = 50; render(); };
  var ms = document.getElementById('model');
  ms.appendChild(el('option', { value: '-1', text: 'すべて' }));
  D.modelOrder.forEach(function (i) { ms.appendChild(el('option', { value: String(i), text: D.models[i] })); });
  ms.onchange = function () { state.model = +ms.value; state.turnLimit = 50; render(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-metric]'), function (b) {
    b.onclick = function () { state.metric = b.getAttribute('data-metric'); sync(); };
  });

  var themeBtn = document.getElementById('theme'), order = ['auto', 'light', 'dark'], labels = { auto: '自動', light: 'ライト', dark: 'ダーク' };
  var cur = 'auto';
  try { cur = localStorage.getItem('usage-theme') || 'auto'; } catch (e) {}
  function applyTheme() {
    if (cur === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', cur);
    themeBtn.textContent = '配色: ' + labels[cur];
  }
  themeBtn.onclick = function () {
    cur = order[(order.indexOf(cur) + 1) % 3];
    try { localStorage.setItem('usage-theme', cur); } catch (e) {}
    applyTheme();
  };
  applyTheme();

  var last = 0, timer = null;
  if (window.ResizeObserver) {
    new ResizeObserver(function (es) {
      var w = Math.round(es[0].contentRect.width);
      if (w === last) return; last = w;
      clearTimeout(timer); timer = setTimeout(render, 120);
    }).observe(document.querySelector('.wrap'));
  }
  sync();
}
function sync() {
  state.turnLimit = 50;
  Array.prototype.forEach.call(document.querySelectorAll('[data-range]'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-range') === state.range ? 'true' : 'false'); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-metric]'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-metric') === state.metric ? 'true' : 'false'); });
  render();
}
init();
})();
</script>
</body>
</html>
